{% extends 'base.html' %}
{% block title %}500 Server Error - IronPeak Fitness{% endblock %}

{% block content %}
<div class="container my-5 text-center py-5">
    <div class="display-1 fw-bold text-warning mb-3">
        <i class="bi bi-exclamation-triangle-fill"></i> 500
    </div>
    <h2 class="fw-bold mb-3">Internal Server Error</h2>
    <p class="text-muted mx-auto" style="max-width: 500px;">
        Something went wrong on our servers. Our technical team has been notified. Please try again in a few moments.
    </p>
    <div class="mt-4">
        <a href="{% url 'index' %}" class="btn btn-primary px-4 me-2">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
            <i class="bi bi-arrow-left me-1"></i> Go Back
        </a>
    </div>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | IronPeak Fitness Studio</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Muli:300,400,600,700,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Oswald:400,500,600,700&display=swap" rel="stylesheet">
    
    <!-- CSS Styles -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css">

    <style>
        body {
            font-family: 'Muli', sans-serif;
            background: radial-gradient(circle at top left, #1a1a2e 0%, #0d0d15 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
            color: #ffffff;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            padding: 15px;
        }

        .auth-card {
            background: rgba(23, 23, 38, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(243, 97, 0, 0.3);
            border-radius: 16px;
            padding: 40px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(243, 97, 0, 0.15);
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-brand img {
            max-width: 160px;
            margin-bottom: 12px;
        }

        .auth-title {
            font-family: 'Oswald', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .auth-subtitle {
            color: #a0a0a0;
            font-size: 13px;
            margin-bottom: 0;
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 8px !important;
            color: #ffffff !important;
            padding: 12px 16px !important;
            font-size: 14px !important;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: #f36100 !important;
            box-shadow: 0 0 10px rgba(243, 97, 0, 0.3) !important;
        }

        .btn-auth {
            background: linear-gradient(135deg, #f36100 0%, #f5365c 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 12px;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(243, 97, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(243, 97, 0, 0.6);
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <a href="{% url 'login' %}">
                <img src="{% static 'img/logo.png' %}" alt="IronPeak Fitness Studio">
            </a>
            <h2 class="auth-title">Password Reset</h2>
            <p class="auth-subtitle">Enter your registered email to receive reset instructions</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show p-2 mb-3 small" role="alert" style="border-radius: 8px; font-size: 13px;">
                    <i class="fa fa-info-circle me-1"></i> {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close" style="color: #fff; opacity: 0.8;">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'forgot-password' %}">
            {% csrf_token %}

            <div class="form-group mb-4">
                <label style="color: #b0b0b0; font-size: 13px; font-weight: 600;" class="mb-1">Account Email Address *</label>
                <input type="email" name="email" class="form-control form-control-custom" placeholder="john@example.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-auth mt-2">
                Send Reset Link <i class="fa fa-paper-plane ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-4 pt-3" style="border-top: 1px solid rgba(255, 255, 255, 0.08);">
            <a href="{% url 'login' %}" style="color: #f36100; font-weight: 700; text-decoration: none;">
                <i class="fa fa-arrow-left me-1"></i> Return to Sign In
            </a>
        </div>
    </div>
</div>

<script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>

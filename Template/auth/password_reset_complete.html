{% extends "base.html" %}
{% load static %}
{% block title %}Password Reset Complete | IronPeak Fitness Studio{% endblock %}

{% block content %}
<section class="spad" style="background: #151515;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div style="background: #1c1c2e; border-radius: 12px; padding: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                    <i class="fa fa-check-circle" style="font-size: 50px; color: #2dce89; margin-bottom: 20px;"></i>
                    <h3 style="color: #fff; font-family: 'Oswald', sans-serif;">PASSWORD RESET COMPLETE</h3>
                    <p style="color: #a0a0a0; font-size: 15px;" class="mt-3">
                        Your password has been successfully updated. You may now sign in with your new credentials.
                    </p>
                    <a href="{% url 'login' %}" class="btn mt-4 px-4 py-2" style="background: #2dce89; color: white; font-weight: 600;">Sign In Now</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
